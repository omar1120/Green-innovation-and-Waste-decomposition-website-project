<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    
    <!-- FIXED: Active, reliable Bootstrap CSS delivery URL -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <!-- FIXED: Steps up out of pages/ to point to your main layout styles -->
    <link rel="stylesheet" href="../css/style.css">

    <style>
        #box0 {
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid #0C340C;
            background-color: #bdd3be;
            margin-bottom: 30px;
        }

        .box {
            background-color: #bdd3be;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 3px double black;
            margin-bottom: 40px;
        }

        h1 {
            color: #2e7d32;
        }

        /* FIXED: Protects email links from breaking into massive green buttons */
        .email-list a {
            display: inline;
            background: none !important;
            color: #198754 !important;
            padding: 0 !important;
            border: none !important;
            text-decoration: underline !important;
            font-weight: normal;
        }
        
        .email-list a:hover {
            color: #0c340c !important;
            background: none !important;
        }
    </style>
</head>

<body>
    
    <!-- FIXED: Restored identical master layout title text styling -->
    <div id="headerpack">
        <h1 id="mainheader">
            Building a Sustainable Future Through Green Innovation
        </h1>
    </div>
    
    <!-- Navigation menu works seamlessly for inner folders -->
    <div id="nav-wrapper">
        <a href="../../index.html" class="btn btn-light">Home Page</a>
        <a href="Workshops-&-Events.html" class="btn btn-light">Workshops &amp; Events</a>
        <a href="Learning-Hub.html" class="btn btn-light">Learning Hub</a>
        <a href="Eco-Impact-Tools.html" class="btn btn-light">Eco-Impact Tools</a>
        <a href="Self-Test-Form.html" class="btn btn-light">Self-Test Form</a>
        <a href="Innovation-Showcases.html" class="btn btn-light">Innovation Showcases</a>
        <a href="About-Us.html" class="btn btn-light">About Us</a>
        <a href="Contact-Us.html" class="btn btn-light">Contact Us</a>
    </div>

    <!-- Main Content Area Wrapper -->
    <div class="container main-content">
        
        <!-- Contact/Feedback Form -->
        <form id="box0" class="shadow-sm">
            <div class="mb-3">
                <label for="fname" class="form-label font-weight-bold">First Name:</label>
                <input type="text" id="fname" name="Fname" class="form-control">
            </div>

            <div class="mb-3">
                <label for="lname" class="form-label">Last Name:</label>
                <input type="text" id="lname" name="Lname" class="form-control">
            </div>

            <div class="mb-3">
                <label for="uname" class="form-label">User Name:</label>
                <input type="text" id="uname" name="Uname" class="form-control">
            </div>

            <div class="mb-3">
                <label for="date" class="form-label">Date:</label>
                <input type="date" id="date" name="Date" class="form-control" style="color: initial; text-align: initial; margin-top: 0;">
            </div>

            <div class="mb-3">
                <label for="number" class="form-label">Number:</label>
                <input type="number" id="number" name="number" class="form-control">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">
                    What do you think about the future of waste management?
                </label>
                <textarea id="message" name="message" rows="5" placeholder="Please enter your answer here." class="form-control"></textarea>
            </div>

            <div class="mt-4">
                <input type="submit" value="Submit" class="btn btn-success me-2">
                <input type="reset" value="Reset" class="btn btn-secondary">
            </div>
        </form>

        <!-- Direct Info Box -->
        <div class="box email-list mx-auto">
            <h1>Contact Us</h1>
            <p class="fs-5">You can contact us via email:</p>
            <p class="fs-5 lh-lg">
                <a href="mailto:202412257@students.asu.edu.jo">Omar Bayado</a><br>
                <a href="mailto:202410789@students.asu.edu.jo">Fawzi alhafi</a><br>
                <a href="mailto:202410968@students.asu.edu.jo">Ayman Abu Al-Nadi</a><br>
                <a href="mailto:202411334@students.asu.edu.jo">Muhammad Al-Hayari</a>
            </p>
        </div>
        
    </div>

    <!-- FIXED: Active Bootstrap JS Bundle URL -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
